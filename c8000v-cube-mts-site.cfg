!=====================================================================
! Cisco Catalyst 8000V (IOS XE 17.x) — CUBE для SIP-транка МТС
! Транк с привязкой по IP (без регистрации)
!
!  WAN  : GigabitEthernet1  10.60.112.98/30  -> шлюз 10.60.112.97
!  LAN  : GigabitEthernet2  10.97.0.156/24   -> шлюз 10.97.0.1
!  SBC МТС          : 10.10.10.13  UDP/5060
!  CUCM Subscriber  : 10.97.0.146  TCP/5060 (основной для вызовов)
!  CUCM Publisher   : 10.97.0.145  TCP/5060 (резерв)
!  Городской номер  : 4951234567 (входящие -> внутренний 2030)
!
!  Нумерация объектов: всё к МТС — 1xx, всё к CUCM — 2xx.
!    tenant 100 / dial-peer 100 (вход) / 101 (выход) / dpg 100  — МТС
!    tenant 200 / dial-peer 200 (вход) / 201 (выход) / dpg 200  — CUCM
!  Маршрутизация только через dpg: от МТС -> всегда CUCM,
!  от CUCM -> всегда МТС. destination-pattern не используются.
!
!  Формат номеров в сторону МТС: 11 цифр, начиная с 7 (7XXXXXXXXXX).
!  Входящие МТС шлёт в 10-значном формате. Если и исходящие МТС ждёт
!  в 10 цифрах — поменять translation-rule 120 и 121 (см. комментарии).
!=====================================================================
!
hostname CUBE-MTS
!
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
!
no ip domain lookup
ip domain name local.lan
!
! --- Учётка и SSH (ЗАМЕНИТЕ <PASSWORD> на свой пароль) ---------------
username admin privilege 15 secret <PASSWORD>
enable secret <PASSWORD>
crypto key generate rsa modulus 2048
ip ssh version 2
!
line vty 0 4
 login local
 transport input ssh
!
! --- Время (для корректных CDR и логов) ------------------------------
clock timezone MSK 3 0
ntp server 10.97.0.145
!
!=====================================================================
! Интерфейсы
!=====================================================================
interface GigabitEthernet1
 description WAN_MTS_SIP
 ip address 10.60.112.98 255.255.255.252
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 negotiation auto
 no shutdown
!
interface GigabitEthernet2
 description LAN_CUCM
 ip address 10.97.0.156 255.255.255.0
 negotiation auto
 no shutdown
!
!=====================================================================
! Маршрутизация
!  - SBC МТС — через WAN
!  - всё остальное (управление, NTP и т.п.) — через LAN-шлюз
!  CUCM (10.97.0.145/146) в той же подсети, что и Gi2 — маршрут не нужен.
!=====================================================================
ip route 10.10.10.13 255.255.255.255 10.60.112.97 name MTS_SBC
ip route 0.0.0.0 0.0.0.0 10.97.0.1 name LAN_DEFAULT
!
! ВНИМАНИЕ: RTP (голос) МТС часто идёт НЕ с адреса SBC, а с отдельных
! медиа-серверов. Запросите у МТС адреса/подсети медиа и добавьте маршрут
! через WAN, иначе RTP уйдёт в LAN-шлюз и будет односторонняя слышимость:
! ip route <MTS_MEDIA_NET> <MASK> 10.60.112.97 name MTS_MEDIA
!
!=====================================================================
! Глобальные настройки VoIP / CUBE
! Всё, что зависит от направления (bind, профили), вынесено в tenant.
!=====================================================================
voice service voip
 ip address trusted list
  ipv4 10.10.10.13 255.255.255.255
  ipv4 10.97.0.145 255.255.255.255
  ipv4 10.97.0.146 255.255.255.255
 address-hiding
 mode border-element license capacity 10
 media statistics
 media bulk-stats
 allow-connections sip to sip
 no supplementary-service sip moved-temporarily
 no supplementary-service sip refer
 no supplementary-service sip handle-replaces
 fax protocol t38 version 0 ls-redundancy 0 hs-redundancy 0 fallback none
 sip
  early-offer forced
  error-passthru
  privacy-policy passthru
  midcall-signaling passthru
  silent-discard untrusted
  no call service stop
!
! --- Кодеки (МТС обычно: G.711A, G.729) -----------------------------
voice class codec 1
 codec preference 1 g711alaw
 codec preference 2 g711ulaw
 codec preference 3 g729r8
!
! --- Распознавание входящих по IP (заголовок Via) --------------------
voice class uri 100 sip
 host ipv4:10.10.10.13
!
voice class uri 200 sip
 host ipv4:10.97.0.145
 host ipv4:10.97.0.146
!
! --- Группа серверов CUCM (Sub -> Pub) -------------------------------
voice class server-group 200
 description CUCM_cluster
 ipv4 10.97.0.146 port 5060 preference 1
 ipv4 10.97.0.145 port 5060 preference 2
 hunt-scheme preference
!
! --- Проверка доступности (SIP OPTIONS) ------------------------------
! Если SBC МТС не отвечает на OPTIONS, dial-peer 101 перейдёт в busyout
! и ВСЕ исходящие перестанут работать. Проверьте после запуска
! (show voice class sip-options-keepalive 100); при статусе Down без
! реальной аварии уберите "voice-class sip options-keepalive" из 101.
voice class sip-options-keepalive 100
 description MTS_SBC
 transport udp
 up-interval 30
 down-interval 30
 retry 3
!
voice class sip-options-keepalive 200
 description CUCM
 transport tcp
 up-interval 30
 down-interval 15
 retry 3
!
!=====================================================================
! SIP-профиль в сторону МТС: убираем служебную информацию
! Применяется ко всем сообщениям, которые CUBE отправляет в МТС:
! INVITE/OPTIONS/BYE (request) и ответам на входящие вызовы (response).
!  - User-Agent / Server   : модель и версия CUBE/CUCM (Cisco-CUCM12.5)
!  - Warning               : внутренняя диагностика и IP CUBE
!                            (399 10.60.112.98 "No matching outgoing dial-peer")
!  - Cisco-Guid            : внутренний идентификатор вызова Cisco
!  - Session-ID            : идентификатор сессии CUCM (RFC 7989)
!  - Remote-Party-ID       : устаревший заголовок Cisco, вместо него PAI
!  - Call-Info             : служебные параметры CUCM
!  - Allow-Events          : перечень событий внутренней АТС
! Причина разъединения (Reason: Q.850) намеренно НЕ удаляется —
! она нужна МТС для корректной обработки отбоя.
!=====================================================================
voice class sip-profiles 100
 rule 10 request ANY sip-header User-Agent remove
 rule 11 response ANY sip-header User-Agent remove
 rule 20 response ANY sip-header Server remove
 rule 21 request ANY sip-header Server remove
 rule 30 response ANY sip-header Warning remove
 rule 40 request ANY sip-header Cisco-Guid remove
 rule 50 request ANY sip-header Session-ID remove
 rule 51 response ANY sip-header Session-ID remove
 rule 60 request ANY sip-header Remote-Party-ID remove
 rule 61 response ANY sip-header Remote-Party-ID remove
 rule 70 request ANY sip-header Call-Info remove
 rule 71 response ANY sip-header Call-Info remove
 rule 80 request ANY sip-header Allow-Events remove
 rule 81 response ANY sip-header Allow-Events remove
!
!=====================================================================
! Тенанты: всё, что зависит от направления, в одном месте
!=====================================================================
voice class tenant 100
 description MTS
 bind control source-interface GigabitEthernet1
 bind media source-interface GigabitEthernet1
 asserted-id pai
 early-offer forced
 sip-profiles 100
!
voice class tenant 200
 description CUCM
 bind control source-interface GigabitEthernet2
 bind media source-interface GigabitEthernet2
 early-offer forced
!
!=====================================================================
! Трансляции номеров
!=====================================================================
!
! --- ВХОДЯЩИЕ от МТС: called 4951234567 (любой формат) -> 2030 -------
voice translation-rule 110
 rule 1 /^4951234567$/   /2030/
 rule 2 /^74951234567$/  /2030/
 rule 3 /^84951234567$/  /2030/
 rule 4 /^\+74951234567$/ /2030/
!
! --- ВХОДЯЩИЕ от МТС: calling -> формат 8XXXXXXXXXX для перезвона ---
!     (+7XXXXXXXXXX / 7XXXXXXXXXX / XXXXXXXXXX -> 8XXXXXXXXXX)
voice translation-rule 111
 rule 1 /^\+7\(..........\)$/ /8\1/
 rule 2 /^7\(..........\)$/   /8\1/
 rule 3 /^\(..........\)$/    /8\1/
!
voice translation-profile FROM_MTS
 translate called 110
 translate calling 111
!
! --- ИСХОДЯЩИЕ в МТС: called -------------------------------------------
!     810... (международные) -> без изменений
!     8XXXXXXXXXX / +7XXXXXXXXXX -> 7XXXXXXXXXX
!     112, 101-104, 01-04 и прочие короткие -> без изменений (нет совпадения)
!     Если МТС ждёт 10 цифр: замените /7\1/ на /\1/
voice translation-rule 120
 rule 1 /^\(810.*\)$/ /\1/
 rule 2 /^8\(..........\)$/ /7\1/
 rule 3 /^\+7\(..........\)$/ /7\1/
!
! --- ИСХОДЯЩИЕ в МТС: calling (АОН) -> городской номер ---------------
!     Любой внутренний -> 74951234567 (в т.ч. для экстренных вызовов)
!     Если МТС ждёт 10 цифр: замените на /4951234567/
voice translation-rule 121
 rule 1 /^.*$/ /74951234567/
!
voice translation-profile TO_MTS
 translate called 120
 translate calling 121
!
!=====================================================================
! Исходящие dial-peer (объявляются ДО dpg, которые на них ссылаются)
!=====================================================================
!
! ----- 101: ИСХОДЯЩИЙ в МТС (все направления) ------------------------
! Номера (город, мобильные, международные, экстренные) различаются
! только преобразованием в translation-rule 120, поэтому достаточно
! одного dial-peer. Какие номера разрешено набирать — решает CUCM
! (Route Pattern / CSS).
dial-peer voice 101 voip
 description OUT-TO-MTS
 session protocol sipv2
 session target ipv4:10.10.10.13:5060
 session transport udp
 translation-profile outgoing TO_MTS
 voice-class codec 1
 voice-class sip tenant 100
 voice-class sip options-keepalive profile 100
 dtmf-relay rtp-nte
 max-conn 10
 no vad
!
! ----- 201: ИСХОДЯЩИЙ в CUCM (Sub -> Pub) ----------------------------
dial-peer voice 201 voip
 description OUT-TO-CUCM
 session protocol sipv2
 session server-group 200
 session transport tcp
 voice-class codec 1
 voice-class sip tenant 200
 voice-class sip options-keepalive profile 200
 dtmf-relay rtp-nte
 no vad
!
!=====================================================================
! Группы dial-peer (детерминированная маршрутизация)
! Шаблоны номеров у исходящих dial-peer при выборе через dpg не
! учитываются: вызов от МТС не может уйти обратно в МТС, и наоборот.
!=====================================================================
voice class dpg 100
 description TO-MTS
 dial-peer 101 preference 1
!
voice class dpg 200
 description TO-CUCM
 dial-peer 201 preference 1
!
!=====================================================================
! Входящие dial-peer
!=====================================================================
!
! ----- 100: ВХОДЯЩИЙ от МТС -> только CUCM ----------------------------
dial-peer voice 100 voip
 description IN-FROM-MTS
 session protocol sipv2
 incoming uri via 100
 destination dpg 200
 translation-profile incoming FROM_MTS
 voice-class codec 1
 voice-class sip tenant 100
 dtmf-relay rtp-nte
 max-conn 10
 no vad
!
! ----- 200: ВХОДЯЩИЙ от CUCM (Pub/Sub) -> только МТС ------------------
dial-peer voice 200 voip
 description IN-FROM-CUCM
 session protocol sipv2
 incoming uri via 200
 destination dpg 100
 voice-class codec 1
 voice-class sip tenant 200
 dtmf-relay rtp-nte
 no vad
!
!=====================================================================
! SIP UA
!=====================================================================
sip-ua
 no remote-party-id
 retry invite 2
 timers trying 150
 timers connect 1000
 timers connection aging 30
!
end
