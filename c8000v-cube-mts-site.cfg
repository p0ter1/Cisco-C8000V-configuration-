!=====================================================================
! Cisco Catalyst 8000V (IOS XE 17.x) — CUBE для SIP-транка МТС
! Транк с привязкой по IP (без регистрации)
!
!  WAN  : GigabitEthernet1  10.60.112.98/30  -> шлюз 10.60.112.97
!  LAN  : GigabitEthernet2  10.97.0.156/24   -> шлюз 10.97.0.1
!  SBC МТС          : 10.10.10.13
!  CUCM Publisher   : 10.97.0.145
!  CUCM Subscriber  : 10.97.0.146
!  Городской номер  : 4951234567 (входящие -> внутренний 2030)
!
!  Формат номеров в сторону МТС: 11 цифр, начиная с 7 (7XXXXXXXXXX).
!  Если МТС ждёт другой формат (10 цифр / +7 / 8) — поменять rule
!  в translation-rule 20 и 21 (см. комментарии).
!=====================================================================
!
hostname CUBE-MTS
!
no ip domain lookup
ip domain name local.lan
!
! --- Учётка и SSH (ЗАМЕНИТЕ <PASSWORD> на свой пароль) ---------------
username admin privilege 15 secret <PASSWORD>
enable secret <PASSWORD>
crypto key generate rsa modulus 2048
ip ssh version 2
!
line vty 0 4
 login local
 transport input ssh
!
! --- Время (для корректных CDR и логов) ------------------------------
clock timezone MSK 3 0
ntp server 10.97.0.145
!
!=====================================================================
! Интерфейсы
!=====================================================================
interface GigabitEthernet1
 description WAN_MTS_SIP
 ip address 10.60.112.98 255.255.255.252
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 negotiation auto
 no shutdown
!
interface GigabitEthernet2
 description LAN_CUCM
 ip address 10.97.0.156 255.255.255.0
 negotiation auto
 no shutdown
!
!=====================================================================
! Маршрутизация
!  - SBC МТС — через WAN
!  - всё остальное (управление, NTP и т.п.) — через LAN-шлюз
!  CUCM (10.97.0.145/146) в той же подсети, что и Gi2 — маршрут не нужен.
!=====================================================================
ip route 10.10.10.13 255.255.255.255 10.60.112.97 name MTS_SBC
ip route 0.0.0.0 0.0.0.0 10.97.0.1 name LAN_DEFAULT
!
! ВНИМАНИЕ: RTP (голос) МТС часто идёт НЕ с адреса SBC, а с отдельных
! медиа-серверов. Запросите у МТС адреса/подсети медиа и добавьте маршрут
! через WAN, иначе RTP уйдёт в LAN-шлюз и будет односторонняя слышимость:
! ip route <MTS_MEDIA_NET> <MASK> 10.60.112.97 name MTS_MEDIA
!
!=====================================================================
! Глобальные настройки VoIP / CUBE
!=====================================================================
voice service voip
 ip address trusted list
  ipv4 10.10.10.13 255.255.255.255
  ipv4 10.97.0.145 255.255.255.255
  ipv4 10.97.0.146 255.255.255.255
 address-hiding
 mode border-element license capacity 10
 media statistics
 media bulk-stats
 allow-connections sip to sip
 no supplementary-service sip refer
 no supplementary-service sip handle-replaces
 fax protocol t38 version 0 ls-redundancy 0 hs-redundancy 0 fallback none
 sip
  early-offer forced
  header-passing
  error-passthru
  asserted-id pai
  privacy-policy passthru
  midcall-signaling passthru
  pass-thru content unsupp
  no call service stop
!
! --- Кодеки (МТС обычно: G.711A, G.729) -----------------------------
voice class codec 1
 codec preference 1 g711alaw
 codec preference 2 g711ulaw
 codec preference 3 g729r8
!
! --- Проверка доступности SBC МТС (SIP OPTIONS) ----------------------
! Если SBC МТС не отвечает на OPTIONS, dial-peer 101-103 перейдут в
! busyout и ВСЕ исходящие перестанут работать. Проверьте после запуска
! (show voice class sip-options-keepalive 1); при статусе Down без
! реальной аварии уберите строки "voice-class sip options-keepalive".
voice class sip-options-keepalive 1
 description MTS_SBC_keepalive
 up-interval 30
 down-interval 30
 retry 3
!
! --- Идентификация вызовов по IP источника ---------------------------
voice class uri MTS sip
 host ipv4:10.10.10.13
!
voice class uri CUCM sip
 host ipv4:10.97.0.145
 host ipv4:10.97.0.146
!
! --- Группа серверов CUCM (Pub -> Sub) -------------------------------
voice class server-group 1
 description CUCM_cluster
 ipv4 10.97.0.145 preference 1
 ipv4 10.97.0.146 preference 2
!
!=====================================================================
! Трансляции номеров
!=====================================================================
!
! --- ВХОДЯЩИЕ от МТС: called 4951234567 (любой формат) -> 2030 -------
voice translation-rule 10
 rule 1 /^4951234567$/   /2030/
 rule 2 /^74951234567$/  /2030/
 rule 3 /^84951234567$/  /2030/
 rule 4 /^\+74951234567$/ /2030/
!
! --- ВХОДЯЩИЕ от МТС: calling -> формат 8XXXXXXXXXX для перезвона ---
!     (+7XXXXXXXXXX / 7XXXXXXXXXX / XXXXXXXXXX -> 8XXXXXXXXXX)
voice translation-rule 11
 rule 1 /^\+7\(..........\)$/ /8\1/
 rule 2 /^7\(..........\)$/   /8\1/
 rule 3 /^\(..........\)$/    /8\1/
!
voice translation-profile FROM_MTS
 translate called 10
 translate calling 11
!
! --- ИСХОДЯЩИЕ в МТС: called 8XXXXXXXXXX -> 7XXXXXXXXXX --------------
!     810... (международка) -> оставляем как есть
!     Если МТС ждёт 10 цифр: замените /7\1/ на /\1/
voice translation-rule 20
 rule 1 /^\(810.*\)$/ /\1/
 rule 2 /^8\(..........\)$/ /7\1/
 rule 3 /^\+7\(..........\)$/ /7\1/
!
! --- ИСХОДЯЩИЕ в МТС: calling (АОН) -> городской номер ---------------
!     Любой внутренний -> 74951234567
!     Если МТС ждёт 10 цифр: замените на /4951234567/
voice translation-rule 21
 rule 1 /^.*$/ /74951234567/
!
voice translation-profile TO_MTS
 translate called 20
 translate calling 21
!
! --- Экстренные: номер не трогаем, только подставляем АОН ------------
voice translation-profile TO_MTS_EMERG
 translate calling 21
!
!=====================================================================
! Dial-peers
!=====================================================================
!
! ----- 100: ВХОДЯЩИЙ от МТС ------------------------------------------
dial-peer voice 100 voip
 description INBOUND_from_MTS
 session protocol sipv2
 incoming uri via MTS
 translation-profile incoming FROM_MTS
 voice-class codec 1
 voice-class sip bind control source-interface GigabitEthernet1
 voice-class sip bind media source-interface GigabitEthernet1
 dtmf-relay rtp-nte
 no vad
!
! ----- 101: ИСХОДЯЩИЙ в МТС — Россия (8/7 + 10 цифр) -----------------
dial-peer voice 101 voip
 description OUTBOUND_to_MTS_national
 destination-pattern [78]..........$
 session protocol sipv2
 session target ipv4:10.10.10.13:5060
 session transport udp
 translation-profile outgoing TO_MTS
 voice-class codec 1
 voice-class sip options-keepalive profile 1
 voice-class sip bind control source-interface GigabitEthernet1
 voice-class sip bind media source-interface GigabitEthernet1
 dtmf-relay rtp-nte
 no vad
!
! ----- 102: ИСХОДЯЩИЙ в МТС — международные (810...) -----------------
dial-peer voice 102 voip
 description OUTBOUND_to_MTS_international
 destination-pattern 810T
 session protocol sipv2
 session target ipv4:10.10.10.13:5060
 session transport udp
 translation-profile outgoing TO_MTS
 voice-class codec 1
 voice-class sip options-keepalive profile 1
 voice-class sip bind control source-interface GigabitEthernet1
 voice-class sip bind media source-interface GigabitEthernet1
 dtmf-relay rtp-nte
 no vad
!
! ----- 103: ИСХОДЯЩИЙ в МТС — экстренные (112, 101-104, 01-04) ------
voice class e164-pattern-map 103
 description EMERGENCY
 e164 112$
 e164 10[1-4]$
 e164 0[1-4]$
!
dial-peer voice 103 voip
 description OUTBOUND_to_MTS_emergency
 destination e164-pattern-map 103
 session protocol sipv2
 session target ipv4:10.10.10.13:5060
 session transport udp
 translation-profile outgoing TO_MTS_EMERG
 voice-class codec 1
 voice-class sip options-keepalive profile 1
 voice-class sip bind control source-interface GigabitEthernet1
 voice-class sip bind media source-interface GigabitEthernet1
 dtmf-relay rtp-nte
 no vad
!
! ----- 200: ВХОДЯЩИЙ от CUCM (Pub/Sub) -------------------------------
dial-peer voice 200 voip
 description INBOUND_from_CUCM
 session protocol sipv2
 incoming uri via CUCM
 voice-class codec 1
 voice-class sip bind control source-interface GigabitEthernet2
 voice-class sip bind media source-interface GigabitEthernet2
 dtmf-relay rtp-nte
 no vad
!
! ----- 201: ИСХОДЯЩИЙ в CUCM (внутренние 4-значные, в т.ч. 2030) -----
dial-peer voice 201 voip
 description OUTBOUND_to_CUCM
 destination-pattern ....$
 session protocol sipv2
 session server-group 1
 session transport udp
 voice-class codec 1
 voice-class sip bind control source-interface GigabitEthernet2
 voice-class sip bind media source-interface GigabitEthernet2
 dtmf-relay rtp-nte
 no vad
!
!=====================================================================
! Группа dial-peer: входящие от МТС идут ТОЛЬКО в CUCM.
! Без неё номер, не совпавший с правилами трансляции 10 (например,
! 74951234568), подошёл бы под dial-peer 101 и ушёл бы обратно в МТС
! (петля / транзит за ваш счёт).
! Блок стоит после dial-peer, т.к. ссылается на уже созданный 201.
!=====================================================================
voice class dpg 1
 description MTS_to_CUCM_only
 dial-peer 201 preference 1
!
dial-peer voice 100 voip
 destination dpg 1
!
!=====================================================================
! SIP UA
!=====================================================================
sip-ua
 retry invite 2
 timers trying 150
 timers connect 1000
!
end
