!=====================================================================
! Cisco Catalyst 8000V (IOS-XE 17.9+) - CUBE
! SIP-транк МТС (аутентификация по IP)  <-->  CUCM (Publisher + Subscriber)
!
! Адресный план (ЗАМЕНИТЕ на свои значения, см. README.md):
!   Gi1 (WAN, к МТС)    203.0.113.10/30, шлюз 203.0.113.9
!   Gi2 (LAN, к CUCM)   10.10.10.1/24,   шлюз во внутр. сеть 10.10.10.254
!   SBC МТС основной    198.51.100.10  UDP/5060
!   SBC МТС резервный   198.51.100.11  UDP/5060
!   Медиа МТС (RTP)     198.51.100.0/24
!   CUCM Subscriber     10.10.20.12  TCP/5060  (основной для вызовов)
!   CUCM Publisher      10.10.20.11  TCP/5060  (резервный)
!   Основной номер      74951234567
!=====================================================================
!
hostname CUBE-01
!
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
no service pad
!
clock timezone MSK 3 0
!
! --- Лицензирование: CUBE работает на любом уровне; сессии CUBE
! --- учитываются через Smart Licensing (mode border-element ниже)
license boot level network-essentials
!
no ip domain lookup
ip domain name example.local
ip name-server 10.10.20.53
!
!---------------------------------------------------------------------
! Управление и защита
!---------------------------------------------------------------------
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
username admin privilege 15 algorithm-type scrypt secret <ПАРОЛЬ>
enable algorithm-type scrypt secret <ПАРОЛЬ>
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
login block-for 120 attempts 5 within 60
!
no ip http server
no ip http secure-server
!
ip access-list standard ACL-MGMT
 10 permit 10.10.0.0 0.0.255.255
 20 deny any log
!
line con 0
 exec-timeout 15 0
 logging synchronous
line vty 0 4
 access-class ACL-MGMT in
 exec-timeout 15 0
 transport input ssh
!
ntp server 10.10.20.11 prefer
ntp server 10.10.20.12
!
logging buffered 1000000 informational
logging host 10.10.20.50
!
!---------------------------------------------------------------------
! Интерфейсы
!---------------------------------------------------------------------
interface GigabitEthernet1
 description WAN-MTS-SIP
 ip address 203.0.113.10 255.255.255.252
 ip access-group ACL-WAN-IN in
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet2
 description LAN-CUCM
 ip address 10.10.10.1 255.255.255.0
 no ip redirects
 no ip proxy-arp
 no shutdown
!
! Маршруты: до SBC/медиа МТС - через провайдерский шлюз,
! во внутреннюю сеть (CUCM, управление) - через LAN.
ip route 198.51.100.0 255.255.255.0 203.0.113.9 name MTS-SIP
ip route 10.10.0.0 255.255.0.0 10.10.10.254 name LAN
!
!---------------------------------------------------------------------
! ACL на WAN: только SIP и RTP от МТС
!---------------------------------------------------------------------
ip access-list extended ACL-WAN-IN
 10 permit udp host 198.51.100.10 host 203.0.113.10 eq 5060
 20 permit udp host 198.51.100.11 host 203.0.113.10 eq 5060
 ! RTP/RTCP: диапазон медиа-портов CUBE по умолчанию 8000-48198
 30 permit udp 198.51.100.0 0.0.0.255 host 203.0.113.10 range 8000 48198
 40 permit icmp 198.51.100.0 0.0.0.255 host 203.0.113.10 echo-reply
 50 permit icmp any host 203.0.113.10 unreachable
 60 permit icmp any host 203.0.113.10 time-exceeded
 1000 deny ip any any log
!
!---------------------------------------------------------------------
! Защита от перегрузки
!---------------------------------------------------------------------
call threshold global cpu-avg low 68 high 75
call threshold global total-mem low 75 high 85
call treatment on
call spike 20 steps 10
!
!---------------------------------------------------------------------
! Глобальные параметры голоса
!---------------------------------------------------------------------
voice service voip
 ! Принимать SIP только от доверенных адресов (защита от toll-fraud)
 ip address trusted list
  ipv4 198.51.100.10 255.255.255.255
  ipv4 198.51.100.11 255.255.255.255
  ipv4 10.10.20.11 255.255.255.255
  ipv4 10.10.20.12 255.255.255.255
 address-hiding
 mode border-element license capacity 30
 media bulk-stats
 allow-connections sip to sip
 no supplementary-service sip moved-temporarily
 no supplementary-service sip refer
 fax protocol t38 version 0 ls-redundancy 0 hs-redundancy 0 fallback pass-through g711alaw
 trace
 sip
  early-offer forced
  midcall-signaling passthru
  header-passing
  error-passthru
  privacy-policy passthru
  session refresh
  silent-discard untrusted
!
voice iec syslog
!
!---------------------------------------------------------------------
! Кодеки: G.711 A-law - основной (стандарт в РФ), G.729 - резерв
!---------------------------------------------------------------------
voice class codec 1
 codec preference 1 g711alaw
 codec preference 2 g711ulaw
 codec preference 3 g729r8
!
!---------------------------------------------------------------------
! Сопоставление входящих вызовов по IP (заголовок Via)
!---------------------------------------------------------------------
voice class uri 100 sip
 host ipv4:198.51.100.10
 host ipv4:198.51.100.11
!
voice class uri 200 sip
 host ipv4:10.10.20.11
 host ipv4:10.10.20.12
!
!---------------------------------------------------------------------
! Группы серверов
!---------------------------------------------------------------------
voice class server-group 100
 description MTS-SBC
 ipv4 198.51.100.10 port 5060 preference 1
 ipv4 198.51.100.11 port 5060 preference 2
 hunt-scheme preference
!
voice class server-group 200
 description CUCM-CLUSTER
 ipv4 10.10.20.12 port 5060 preference 1
 ipv4 10.10.20.11 port 5060 preference 2
 hunt-scheme preference
!
!---------------------------------------------------------------------
! OPTIONS keepalive: недоступный сервер исключается из группы
!---------------------------------------------------------------------
voice class sip-options-keepalive 100
 description MTS
 transport udp
 up-interval 30
 down-interval 30
 retry 3
!
voice class sip-options-keepalive 200
 description CUCM
 transport tcp
 up-interval 30
 down-interval 15
 retry 3
!
!---------------------------------------------------------------------
! SIP-профиль к МТС: скрываем служебные заголовки Cisco
!---------------------------------------------------------------------
voice class sip-profiles 100
 rule 10 request ANY sip-header Cisco-Guid remove
 rule 20 request ANY sip-header User-Agent remove
 rule 30 response ANY sip-header Server remove
!
!---------------------------------------------------------------------
! Тенанты: привязка сигнализации и медиа к интерфейсам
!---------------------------------------------------------------------
voice class tenant 100
 description MTS
 bind control source-interface GigabitEthernet1
 bind media source-interface GigabitEthernet1
 asserted-id pai
 early-offer forced
 sip-profiles 100
!
voice class tenant 200
 description CUCM
 bind control source-interface GigabitEthernet2
 bind media source-interface GigabitEthernet2
 early-offer forced
!
!---------------------------------------------------------------------
! Нормализация номеров
! CUCM <-> CUBE: E.164 с "+" (+7XXXXXXXXXX)
! CUBE <-> МТС: 11 цифр 7XXXXXXXXXX, международные 810...
! (точный формат уточните у МТС при подключении)
!---------------------------------------------------------------------
! Вызываемый номер -> МТС
voice translation-rule 100
 rule 1 /^\+7\(..........\)$/ /7\1/
 rule 2 /^8\(..........\)$/ /7\1/
 rule 3 /^\+\(.*\)$/ /810\1/
!
! Номер абонента (АОН) -> МТС
! Короткие внутренние номера подменяются основным номером
voice translation-rule 101
 rule 1 /^\+7\(..........\)$/ /7\1/
 rule 2 /^8\(..........\)$/ /7\1/
 rule 3 /^[1-9]...$/ /74951234567/
!
! Вызываемый и вызывающий номера от МТС -> CUCM
voice translation-rule 200
 rule 1 /^[78]\(..........\)$/ /+7\1/
 rule 2 /^\(..........\)$/ /+7\1/
 rule 3 /^810\(.*\)$/ /+\1/
!
voice translation-profile TP-TO-MTS
 translate called 100
 translate calling 101
!
voice translation-profile TP-FROM-MTS
 translate called 200
 translate calling 200
!
!---------------------------------------------------------------------
! Группы dial-peer (детерминированная маршрутизация)
!---------------------------------------------------------------------
voice class dpg 100
 description TO-MTS
 dial-peer 100
!
voice class dpg 200
 description TO-CUCM
 dial-peer 200
!
!---------------------------------------------------------------------
! Dial-peer'ы
!---------------------------------------------------------------------
! Исходящий к МТС
dial-peer voice 100 voip
 description OUT-TO-MTS
 session protocol sipv2
 session server-group 100
 session transport udp
 translation-profile outgoing TP-TO-MTS
 voice-class codec 1
 voice-class sip tenant 100
 voice-class sip options-keepalive profile 100
 dtmf-relay rtp-nte
 max-conn 30
 no vad
!
! Входящий от МТС
dial-peer voice 101 voip
 description IN-FROM-MTS
 session protocol sipv2
 incoming uri via 100
 destination dpg 200
 translation-profile incoming TP-FROM-MTS
 voice-class codec 1
 voice-class sip tenant 100
 dtmf-relay rtp-nte
 max-conn 30
 no vad
!
! Исходящий к CUCM (Subscriber -> Publisher)
dial-peer voice 200 voip
 description OUT-TO-CUCM
 session protocol sipv2
 session server-group 200
 session transport tcp
 voice-class codec 1
 voice-class sip tenant 200
 voice-class sip options-keepalive profile 200
 dtmf-relay rtp-nte
 no vad
!
! Входящий от CUCM (любая из двух нод)
dial-peer voice 201 voip
 description IN-FROM-CUCM
 session protocol sipv2
 incoming uri via 200
 destination dpg 100
 voice-class codec 1
 voice-class sip tenant 200
 dtmf-relay rtp-nte
 no vad
!
!---------------------------------------------------------------------
! SIP UA
!---------------------------------------------------------------------
sip-ua
 no remote-party-id
 retry invite 2
 timers trying 150
 timers connection aging 30
!
end
