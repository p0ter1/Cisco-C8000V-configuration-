!=====================================================================
! Cisco C1111-4P (IOS-XE 17.12+) - CUBE
! SIP-транк Ростелеком (регистрация по логину/паролю)  <-->  CUCM (PUB + SUB)
! Схема: tenant + dpg, VRF-aware CUBE
!
! Исходные данные:
!   Gi0/0/0 WAN   123.45.68.97/30, шлюз 123.45.68.98   VRF INET-PUBLIC1
!   Gi0/0/1 LAN   10.50.51.62/27                         VRF VoIP
!   SBC РТ        95.167.123.123 UDP/5060, realm 123456.78.rt.ru
!   CUCM SUB      10.97.0.146 TCP/5060 (основной)
!   CUCM PUB      10.97.0.145 TCP/5060 (резервный)
!   DID -> внутр. 3521234567 -> 2030, 3521234568 -> 2031, 3521234569 -> 2032
!
! !!! ЗАМЕНИТЬ перед применением:
!   10.50.51.33     - шлюз LAN-сети в сторону CUCM (не задан в исходных данных)
!   <SIP-ПАРОЛЬ>    - пароль SIP-учётной записи РТ
!   <ПАРОЛЬ>        - пароли администратора
!=====================================================================
!
hostname CUBE-RT-01
!
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
no service pad
!
clock timezone YEKT 5 0
!
no ip domain lookup
!
!---------------------------------------------------------------------
! Шифрование паролей в конфигурации (type 6, AES)
! Мастер-ключ задаётся один раз и в конфигурации не отображается:
!   key config-key password-encrypt <МАСТЕР-КЛЮЧ>
!---------------------------------------------------------------------
password encryption aes
!
!---------------------------------------------------------------------
! VRF
!---------------------------------------------------------------------
vrf definition INET-PUBLIC1
 description Internet / SIP Rostelecom
 address-family ipv4
 exit-address-family
!
vrf definition VoIP
 description LAN / CUCM
 address-family ipv4
 exit-address-family
!
!---------------------------------------------------------------------
! Управление и защита
!---------------------------------------------------------------------
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
username admin privilege 15 algorithm-type scrypt secret <ПАРОЛЬ>
enable algorithm-type scrypt secret <ПАРОЛЬ>
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
login block-for 120 attempts 5 within 60
!
no ip http server
no ip http secure-server
!
ip access-list standard ACL-MGMT
 10 permit 10.50.51.32 0.0.0.31
 20 permit 10.97.0.0 0.0.0.255
 30 deny any log
!
line con 0
 exec-timeout 15 0
 logging synchronous
line vty 0 4
 access-class ACL-MGMT in vrf-also
 exec-timeout 15 0
 transport input ssh
!
ntp server vrf VoIP 10.97.0.145 prefer
ntp server vrf VoIP 10.97.0.146
!
logging buffered 1000000 informational
!
!---------------------------------------------------------------------
! Интерфейсы
! Gi0/0/0 и Gi0/0/1 - маршрутизируемые порты; Gi0/1/0-3 - коммутатор, не используются
!---------------------------------------------------------------------
interface GigabitEthernet0/0/0
 description WAN-RT-SIP
 vrf forwarding INET-PUBLIC1
 ip address 123.45.68.97 255.255.255.252
 ip access-group ACL-WAN-IN in
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/0/1
 description LAN-VoIP-CUCM
 vrf forwarding VoIP
 ip address 10.50.51.62 255.255.255.224
 no ip redirects
 no ip proxy-arp
 no shutdown
!
interface range GigabitEthernet0/1/0 - 3
 shutdown
!
ip route vrf INET-PUBLIC1 0.0.0.0 0.0.0.0 GigabitEthernet0/0/0 123.45.68.98 name RT-GW
ip route vrf VoIP 10.97.0.0 255.255.255.0 10.50.51.33 name CUCM
!
!---------------------------------------------------------------------
! ACL на WAN: только SIP и RTP от SBC РТ
! (если РТ отдаёт медиа с других адресов - добавьте их подсеть в строку 20)
!---------------------------------------------------------------------
ip access-list extended ACL-WAN-IN
 10 permit udp host 95.167.123.123 host 123.45.68.97 eq 5060
 20 permit udp host 95.167.123.123 host 123.45.68.97 range 8000 48198
 30 permit icmp host 123.45.68.98 host 123.45.68.97 echo-reply
 40 permit icmp any host 123.45.68.97 unreachable
 50 permit icmp any host 123.45.68.97 time-exceeded
 1000 deny ip any any log
!
!---------------------------------------------------------------------
! Защита от перегрузки
!---------------------------------------------------------------------
call threshold global cpu-avg low 68 high 75
call threshold global total-mem low 75 high 85
call treatment on
call spike 10 steps 10
!
!---------------------------------------------------------------------
! Глобальные параметры голоса
!---------------------------------------------------------------------
voice service voip
 ip address trusted list
  ipv4 95.167.123.123 255.255.255.255
  ipv4 10.97.0.145 255.255.255.255
  ipv4 10.97.0.146 255.255.255.255
 address-hiding
 mode border-element license capacity 10
 media bulk-stats
 allow-connections sip to sip
 no supplementary-service sip moved-temporarily
 no supplementary-service sip refer
 fax protocol t38 version 0 ls-redundancy 0 hs-redundancy 0 fallback pass-through g711alaw
 trace
 sip
  early-offer forced
  midcall-signaling passthru
  header-passing
  error-passthru
  privacy-policy passthru
  session refresh
  silent-discard untrusted
  sip-profiles inbound
!
voice iec syslog
!
!---------------------------------------------------------------------
! Кодеки. На C1111-4P нет DSP, транскодирование невозможно:
! G.711 A-law должен поддерживаться обеими сторонами.
!---------------------------------------------------------------------
voice class codec 1
 codec preference 1 g711alaw
 codec preference 2 g711ulaw
 codec preference 3 g729r8
!
!---------------------------------------------------------------------
! Распознавание входящих вызовов
!---------------------------------------------------------------------
voice class uri 100 sip
 host ipv4:95.167.123.123
!
voice class uri 200 sip
 host ipv4:10.97.0.145
 host ipv4:10.97.0.146
!
! Экстренные номера от CUCM (вызовы на LAN-адрес CUBE):
! 112, 101 пожарная, 102 полиция, 103 скорая, 104 газ, 01-04, 911
voice class uri 110 sip
 pattern ^sip:(112|911|10[1-4]|0[1-4])@10\.50\.51\.62
!
!---------------------------------------------------------------------
! Группа серверов CUCM: Subscriber основной, Publisher резервный
!---------------------------------------------------------------------
voice class server-group 200
 description CUCM-CLUSTER
 ipv4 10.97.0.146 port 5060 preference 1
 ipv4 10.97.0.145 port 5060 preference 2
 hunt-scheme preference
!
voice class sip-options-keepalive 200
 description CUCM
 transport tcp
 up-interval 30
 down-interval 15
 retry 3
!
!---------------------------------------------------------------------
! SIP-профили РТ
!---------------------------------------------------------------------
! Исходящие к РТ: домен realm вместо IP SBC в Request-URI и To,
! удаление служебных заголовков Cisco
voice class sip-profiles 100
 rule 10 request REGISTER request-line modify "sip:95\.167\.123\.123" "sip:123456.78.rt.ru"
 rule 20 request ANY request-line modify "@95\.167\.123\.123" "@123456.78.rt.ru"
 rule 30 request ANY sip-header To modify "@95\.167\.123\.123" "@123456.78.rt.ru"
 rule 40 request ANY sip-header Cisco-Guid remove
 rule 50 request ANY sip-header User-Agent remove
 rule 60 response ANY sip-header Server remove
!
! Входящие от РТ: при регистрации одной учётной записи РТ шлёт INVITE
! на Contact (3521234567) для всех номеров группы, а набранный DID
! передаёт в заголовке To. Переносим номер из To в Request-URI.
voice class sip-profiles 101
 rule 10 request INVITE sip-header To copy "sip:([0-9]+)@" u01
 rule 20 request INVITE request-line modify "sip:[0-9]+@" "sip:\u01@"
!
!---------------------------------------------------------------------
! Тенанты
!---------------------------------------------------------------------
voice class tenant 100
 description ROSTELECOM
 registrar ipv4:95.167.123.123:5060 expires 3600
 credentials number 3521234567 username 3521234567 password 0 <SIP-ПАРОЛЬ> realm 123456.78.rt.ru
 authentication username 3521234567 password 0 <SIP-ПАРОЛЬ> realm 123456.78.rt.ru
 sip-server ipv4:95.167.123.123:5060
 localhost dns:123456.78.rt.ru
 bind control source-interface GigabitEthernet0/0/0
 bind media source-interface GigabitEthernet0/0/0
 no remote-party-id
 asserted-id pai
 early-offer forced
 sip-profiles 100
!
voice class tenant 200
 description CUCM
 bind control source-interface GigabitEthernet0/0/1
 bind media source-interface GigabitEthernet0/0/1
 early-offer forced
!
!---------------------------------------------------------------------
! Нормализация номеров
! CUCM <-> CUBE: внутренние 2030-2032 / +E.164
! CUBE <-> РТ:   АОН 10 цифр, вызываемый 8XXXXXXXXXX, международные 810...
!---------------------------------------------------------------------
! Вызываемый номер -> РТ
voice translation-rule 100
 rule 1 /^\+7\(..........\)$/ /8\1/
 rule 2 /^7\(..........\)$/ /8\1/
 rule 3 /^\+\(.*\)$/ /810\1/
!
! АОН -> РТ: каждый внутренний со своим DID, остальные - основной номер
voice translation-rule 101
 rule 1 /^2030$/ /3521234567/
 rule 2 /^2031$/ /3521234568/
 rule 3 /^2032$/ /3521234569/
 rule 4 /^.*\(352123456[789]\)$/ /\1/
 rule 5 /^.*$/ /3521234567/
!
! Экстренные -> РТ: 01-04 -> 101-104, 911 -> 112
voice translation-rule 110
 rule 1 /^0\([1-4]\)$/ /10\1/
 rule 2 /^911$/ /112/
!
! Вызываемый DID от РТ -> внутренний номер (с 7, 8 или без префикса)
voice translation-rule 200
 rule 1 /^.*3521234567$/ /2030/
 rule 2 /^.*3521234568$/ /2031/
 rule 3 /^.*3521234569$/ /2032/
!
! АОН от РТ -> +E.164
voice translation-rule 201
 rule 1 /^[78]\(..........\)$/ /+7\1/
 rule 2 /^\(..........\)$/ /+7\1/
 rule 3 /^810\(.*\)$/ /+\1/
!
voice translation-profile TP-TO-RT
 translate called 100
 translate calling 101
!
voice translation-profile TP-TO-RT-EMERGENCY
 translate called 110
 translate calling 101
!
voice translation-profile TP-FROM-RT
 translate called 200
 translate calling 201
!
!---------------------------------------------------------------------
! Группы dial-peer
!---------------------------------------------------------------------
voice class dpg 100
 description TO-RT
 dial-peer 100
!
voice class dpg 110
 description TO-RT-EMERGENCY
 dial-peer 110
!
voice class dpg 200
 description TO-CUCM
 dial-peer 200
!
!---------------------------------------------------------------------
! Dial-peer'ы
!---------------------------------------------------------------------
! Исходящий к РТ
dial-peer voice 100 voip
 description OUT-TO-RT
 session protocol sipv2
 session target sip-server
 session transport udp
 translation-profile outgoing TP-TO-RT
 voice-class codec 1
 voice-class sip tenant 100
 dtmf-relay rtp-nte
 no vad
!
! Исходящий к РТ: экстренные службы
dial-peer voice 110 voip
 description OUT-TO-RT-EMERGENCY
 session protocol sipv2
 session target sip-server
 session transport udp
 translation-profile outgoing TP-TO-RT-EMERGENCY
 voice-class codec 1
 voice-class sip tenant 100
 dtmf-relay rtp-nte
 no vad
!
! Входящий от РТ
dial-peer voice 101 voip
 description IN-FROM-RT
 session protocol sipv2
 incoming uri via 100
 destination dpg 200
 translation-profile incoming TP-FROM-RT
 voice-class codec 1
 voice-class sip tenant 100
 voice-class sip profiles 101 inbound
 dtmf-relay rtp-nte
 no vad
!
! Исходящий к CUCM (Subscriber -> Publisher)
dial-peer voice 200 voip
 description OUT-TO-CUCM
 session protocol sipv2
 session server-group 200
 session transport tcp
 voice-class codec 1
 voice-class sip tenant 200
 voice-class sip options-keepalive profile 200
 dtmf-relay rtp-nte
 no vad
!
! Входящий от CUCM
dial-peer voice 201 voip
 description IN-FROM-CUCM
 session protocol sipv2
 incoming uri via 200
 destination dpg 100
 voice-class codec 1
 voice-class sip tenant 200
 dtmf-relay rtp-nte
 no vad
!
! Входящий от CUCM: экстренные службы
dial-peer voice 202 voip
 description IN-FROM-CUCM-EMERGENCY
 session protocol sipv2
 incoming uri request 110
 destination dpg 110
 voice-class codec 1
 voice-class sip tenant 200
 dtmf-relay rtp-nte
 no vad
!
!---------------------------------------------------------------------
! SIP UA
!---------------------------------------------------------------------
sip-ua
 no remote-party-id
 retry invite 2
 retry register 10
 timers register 500
 timers trying 150
 timers connection aging 30
!
end
